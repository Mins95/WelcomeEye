capture_snapshot:
  name: Capture snapshot
  description: Capture a fresh image using the shared media session, optionally saving it in Home Assistant Media.
  target:
    entity:
      integration: welcomeeye_local
      domain: camera
  fields:
    save_to_media:
      name: Save to Media
      description: Save the JPEG in the configured Home Assistant media directory. A storage failure still updates the last snapshot image.
      default: true
      selector:
        boolean:
r002_probe:
  name: Probe R002
  description: Explicit protocol investigation; one request per allowed type, without retries. No media or output command.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    types:
      name: Types
      description: Select only the short request types already observed in issue 7.
      default: [14, 15, 26, 28]
      selector:
        object:
    include_header:
      name: Include response prefix
      description: Administrator only. Return up to 12 raw bytes in this response. Review before sharing; script traces may retain them.
      default: false
      selector:
        boolean:
    include_response:
      name: Observe short response
      description: Administrator only. Collect up to 64 bytes for at most 3 seconds, then compare provisional 10/12-byte layouts. Includes prefix details. Review before sharing; traces may retain bytes.
      default: false
      selector:
        boolean:
r002_check_certificate:
  name: Check R002 certificate metadata
  description: Explicit bounded TLS-only check on port 443. Does not authenticate trust or change entry identity.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
r002_discover_qv:
  name: Observe QV LAN discovery
  description: Administrator only. One broadcast on UDP 5000, listen on 5001/5003 for at most 3 seconds. Only the configured device's replies are retained. No login or media. Requires a shared broadcast network; a missing reply is inconclusive.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    include_response:
      name: Include raw datagrams
      description: Return up to 4 datagrams of at most 2048 bytes each. May contain identifiers; review before sharing publicly. HA script traces may retain responses.
      default: false
      selector:
        boolean:
connect3_discover:
  name: Discover Connect 3
  description: Administrator only. One UDP discovery with local decoding; no authentication, media or output commands. Requires the same broadcast network.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    include_details:
      name: Include metadata
      description: Return advertised ports and text fields only in this action response. Review before sharing; HA traces can retain them.
      default: false
      selector:
        boolean:
connect3_check_access:
  name: Check Connect 3 access
  description: Administrator only. One HTTPS streamkey read using the configured local authCode. No key returned, no media opened.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
connect3_list_records:
  name: List Connect 3 picture records
  description: Administrator only. Metadata only, maximum 4 pages in 12 seconds. No photo download or ring correlation. Monitor local time; maximum 24-hour range.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    start:
      name: Start
      description: Monitor local time, YYYY-MM-DD HH:MM:SS.
      required: true
      selector:
        text:
    end:
      name: End
      description: Monitor local time, YYYY-MM-DD HH:MM:SS.
      required: true
      selector:
        text:
    channel:
      name: Channel
      default: 1
      selector:
        number:
          min: 1
          max: 64
          mode: box
    include_details:
      name: Include records
      description: Return private filenames and timestamps in this response only. Review before sharing; HA traces can retain them.
      default: false
      selector:
        boolean:
