capture_snapshot:
  name: Capture snapshot
  description: Capture a fresh image using the shared media session, optionally saving it in Home Assistant Media.
  target:
    entity:
      integration: welcomeeye_local
      domain: camera
  fields:
    save_to_media:
      name: Save to Media
      description: Save the JPEG in the configured Home Assistant media directory. A storage failure still updates the last snapshot image.
      default: true
      selector:
        boolean:
r002_probe:
  name: Probe R002
  description: Explicit protocol investigation; one request per allowed type, without retries. No media or output command.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    types:
      name: Types
      description: Select only the short request types already observed in issue 7.
      default: [14, 15, 26, 28]
      selector:
        object:
    include_header:
      name: Include response prefix
      description: Administrator only. Return up to 12 raw bytes in this response. Review before sharing; script traces may retain them.
      default: false
      selector:
        boolean:
    include_response:
      name: Observe short response
      description: Administrator only. Collect up to 64 bytes for at most 3 seconds, then compare provisional 10/12-byte layouts. Includes prefix details. Review before sharing; traces may retain bytes.
      default: false
      selector:
        boolean:
r002_check_certificate:
  name: Check R002 certificate metadata
  description: Explicit bounded TLS-only check on port 443. Does not authenticate trust or change entry identity.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
