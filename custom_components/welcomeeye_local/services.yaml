capture_snapshot:
  name: Capture snapshot
  description: Capture a fresh image using the shared media session, optionally saving it in Home Assistant Media.
  target:
    entity:
      integration: welcomeeye_local
      domain: camera
  fields:
    save_to_media:
      name: Save to Media
      description: Save the JPEG in the configured Home Assistant media directory. A storage failure still updates the last snapshot image.
      default: true
      selector:
        boolean:
r002_probe:
  name: Probe R002
  description: Explicit protocol investigation; one request per allowed type, without retries. No media or output command.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    types:
      name: Types
      description: Select only the short request types already observed in issue 7.
      default: [14, 15, 26, 28]
      selector:
        object:
    include_header:
      name: Include response prefix
      description: Administrator only. Return up to 12 raw bytes in this response. Review before sharing; script traces may retain them.
      default: false
      selector:
        boolean:
    include_response:
      name: Observe short response
      description: Administrator only. Collect up to 64 bytes for at most 3 seconds, then compare provisional 10/12-byte layouts. Includes prefix details. Review before sharing; traces may retain bytes.
      default: false
      selector:
        boolean:
r002_check_certificate:
  name: Check R002 certificate metadata
  description: Explicit bounded TLS-only check on port 443. Does not authenticate trust or change entry identity.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
r002_discover_qv:
  name: Observe QV LAN discovery
  description: Administrator only. One broadcast on UDP 5000, listen on 5001/5003 for at most 3 seconds. Decode matching QV replies locally. No login or media. Requires a shared broadcast network; a missing reply is inconclusive.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    include_details:
      name: Include decoded metadata
      description: Return advertised model, firmware, ports and channel count only in this action response. No UID or IP. Metadata does not prove R002 compatibility; review before sharing.
      default: false
      selector:
        boolean:
    include_response:
      name: Include raw datagrams
      description: Return up to 4 datagrams of at most 2048 bytes each. May contain identifiers; review before sharing publicly. HA script traces may retain responses.
      default: false
      selector:
        boolean:
r002_check_access:
  name: Check R002 access
  description: Administrator only. Check the QV profile with fresh LAN discovery, then read streamkey over HTTPS on port 443 using the configured local password. No key returned, media opened or output command sent.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
r002_check_qv_certificate:
  name: Inspect R002 QV HTTPS certificate
  description: Administrator only. One QV LAN discovery checks the profile, then a bounded TLS inspection uses port 443 without HTTP or credentials. Independently verify the fingerprint before entering it in Reconfigure; never saved automatically.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    include_details:
      name: Include SHA256 fingerprint
      description: Return the fingerprint in this action response only. HA script traces may retain it. Off by default.
      default: false
      selector:
        boolean:
r002_observe_doorbell:
  name: Observe R002 doorbell during live video
  description: Administrator only. Open R002 QV live video, start observation, press the physical bell once, then mark. Passively observe the existing reader without another connection. Counts and relative timing only; stops on timeout or video close. No automatic standby ring detection.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    operation:
      name: Operation
      description: A marker records your reported press, not a detected ring.
      required: true
      selector:
        select:
          options:
            - start
            - mark
            - status
            - stop
    duration:
      name: Observation duration
      description: Applied only to start; seconds, no automatic repeat.
      default: 90
      selector:
        number:
          min: 30
          max: 120
          unit_of_measurement: s
          mode: box
connect3_discover:
  name: Discover Connect 3
  description: Administrator only. One UDP discovery with local decoding; no authentication, media or output commands. Requires the same broadcast network.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    include_details:
      name: Include metadata
      description: Return advertised ports and text fields only in this action response. Review before sharing; HA traces can retain them.
      default: false
      selector:
        boolean:
connect3_check_certificate:
  name: Inspect Connect 3 HTTPS certificate
  description: Administrator only. One bounded TLS-only inspection of the configured CGI endpoint. Sends no HTTP or credential, does not authenticate trust and never saves a pin automatically.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    include_details:
      name: Include SHA256 fingerprint
      description: Return the certificate fingerprint in this action response only. Independently verify before configuring trust. Review before sharing; HA traces may retain it.
      default: false
      selector:
        boolean:
connect3_check_access:
  name: Check Connect 3 access
  description: Administrator only. One HTTPS streamkey read using the configured local authCode. For an imported QR, first require a matching UID/model from one fresh discovery. No key returned, no media opened.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
connect3_check_media_certificate:
  name: Inspect Connect 3 media certificate
  description: Administrator only. TLS-only inspection of the configured media port. No stream, credential or command is sent. Verify the fingerprint independently; it is never saved automatically.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    include_details:
      name: Include SHA256 fingerprint
      description: Return the fingerprint only in this response. HA script traces may retain it.
      default: false
      selector:
        boolean:
connect3_observe_doorbell:
  name: Observe Connect 3 doorbell during live video
  description: Administrator only. Open live video first. Start a bounded passive observation, press the physical bell once, then mark the press. Status returns counts and relative timing, never payloads. Stops on deadline or video close. Does not implement standby ring detection or send commands.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - start
            - mark
            - status
            - stop
    duration:
      name: Observation duration
      description: Applied only to start; seconds, no automatic repeat.
      default: 90
      selector:
        number:
          min: 30
          max: 120
          unit_of_measurement: s
          mode: box
connect3_list_records:
  name: List Connect 3 picture records
  description: Administrator only. Metadata only, maximum 4 pages in 12 seconds. No photo download or ring correlation. Monitor local time; maximum 24-hour range.
  target:
    entity:
      integration: welcomeeye_local
      domain: sensor
  fields:
    start:
      name: Start
      description: Monitor local time, YYYY-MM-DD HH:MM:SS.
      required: true
      selector:
        text:
    end:
      name: End
      description: Monitor local time, YYYY-MM-DD HH:MM:SS.
      required: true
      selector:
        text:
    channel:
      name: Channel
      default: 1
      selector:
        number:
          min: 1
          max: 64
          mode: box
    include_details:
      name: Include records
      description: Return private filenames and timestamps in this response only. Review before sharing; HA traces can retain them.
      default: false
      selector:
        boolean:
experimental_version_info:
  name: Experimental legacy version query
  description: Administrator only. One opt-in private version query on an idle legacy device. Requires its normal doorbell listener disabled; does not interrupt an active session.
  target:
    entity:
      integration: welcomeeye_local
      domain: camera
  fields:
    confirm:
      name: Confirm this single diagnostic attempt
      required: true
      default: false
      selector:
        boolean:
experimental_additional_camera:
  name: Experimental additional camera diagnostic
  description: Administrator only. One bounded channel 18 and selector 18 attempt on an idle legacy device. Does not prove the optional camera mapping, create an entity, record images or operate outputs.
  target:
    entity:
      integration: welcomeeye_local
      domain: camera
  fields:
    confirm:
      name: Confirm this single diagnostic attempt
      required: true
      default: false
      selector:
        boolean:
experimental_udt_probe:
  name: Experimental legacy UDT handshake
  description: Administrator only, idle legacy device. One bounded handshake on an independently established UDP endpoint when UDP 1500 discovery is absent or unusable. No scan, cloud, login, media or output command.
  target:
    entity:
      integration: welcomeeye_local
      domain: camera
  fields:
    confirm:
      name: Confirm this single diagnostic attempt
      required: true
      default: false
      selector:
        boolean:
    legacy_discovery_absent:
      name: UDP 1500 discovery is absent or unusable
      description: Confirm an observed failure, not an assumption about the transport.
      required: true
      default: false
      selector:
        boolean:
    udp_port:
      name: Established UDP endpoint port
      description: Use only a port established independently for this device. Never guess or scan; the target IP comes from the entry.
      required: true
      selector:
        number:
          min: 1
          max: 65535
          mode: box
