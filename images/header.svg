<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Philips WelcomeEye for Home Assistant</title>
  <desc id="desc">Local video intercom integration for Home Assistant</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.48" stop-color="#132b4c"/>
      <stop offset="1" stop-color="#0b6fa4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41bdf5"/>
      <stop offset="1" stop-color="#72e6c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="30" fill="url(#bg)"/>
  <circle cx="1105" cy="90" r="185" fill="#41bdf5" opacity="0.08"/>
  <circle cx="1180" cy="355" r="230" fill="#72e6c7" opacity="0.07"/>
  <circle cx="475" cy="-10" r="160" fill="#ffffff" opacity="0.035"/>

  <g transform="translate(78 54)" filter="url(#shadow)">
    <rect x="0" y="0" width="208" height="312" rx="42" fill="#111827" stroke="#38506f" stroke-width="2"/>
    <rect x="23" y="26" width="162" height="120" rx="20" fill="#07111f" stroke="#274661" stroke-width="2"/>
    <circle cx="104" cy="86" r="37" fill="#0e263c" stroke="#41bdf5" stroke-width="4"/>
    <circle cx="104" cy="86" r="17" fill="#4cc9f0" opacity="0.92"/>
    <circle cx="104" cy="86" r="7" fill="#d8f7ff"/>
    <circle cx="104" cy="181" r="22" fill="#1d2b3c" stroke="#72e6c7" stroke-width="3"/>
    <path d="M94 181c0-6 4-10 10-10s10 4 10 10v7H94z" fill="#72e6c7"/>
    <path d="M76 231h56" stroke="#4b627e" stroke-width="6" stroke-linecap="round"/>
    <path d="M86 252h36" stroke="#4b627e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="104" cy="284" r="8" fill="#41bdf5"/>
  </g>

  <g transform="translate(350 92)">
    <rect x="0" y="0" width="92" height="36" rx="18" fill="#41bdf5" opacity="0.16"/>
    <circle cx="20" cy="18" r="7" fill="#72e6c7"/>
    <text x="36" y="23" fill="#bdefff" font-size="15" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">LOCAL FIRST</text>

    <text x="0" y="92" fill="#ffffff" font-size="56" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif">Philips WelcomeEye</text>
    <text x="0" y="146" fill="#a9dfff" font-size="34" font-weight="650" font-family="Inter,Segoe UI,Arial,sans-serif">for Home Assistant</text>
    <text x="0" y="202" fill="#dbeafe" font-size="21" font-weight="450" font-family="Inter,Segoe UI,Arial,sans-serif">Live video • Doorbell events • Door &amp; gate control</text>
