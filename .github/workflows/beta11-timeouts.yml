name: Apply beta 11 startup timeouts

on:
  push:
    branches:
      - beta11-v1-transport
    paths:
      - .github/workflows/beta11-timeouts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch startup timeouts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'custom_components/welcomeeye_local/hub.py': [
                  ('await asyncio.wait_for(self.ready.wait(), 22)',
                   'await asyncio.wait_for(self.ready.wait(), 38)'),
              ],
              'custom_components/welcomeeye_local/rtc.py': [
                  ('await asyncio.sleep(45)', 'await asyncio.sleep(60)'),
                  ('async with asyncio.timeout(30):', 'async with asyncio.timeout(50):'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise RuntimeError(f'{filename}: expected one match for {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Compile
        run: python -m compileall -q custom_components/welcomeeye_local
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/welcomeeye_local/hub.py custom_components/welcomeeye_local/rtc.py
          git diff --cached --quiet && exit 0
          git commit -m "Allow V1 transport handshake to complete"
          git push
