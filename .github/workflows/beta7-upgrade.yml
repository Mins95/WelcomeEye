name: Apply beta 7

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/beta7-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recover and apply beta 7 overlay
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Mins95/WelcomeEye/dc0e674e2cea9e70457ba7681c6aee7f165d1e1b/.github/workflows/beta7-upgrade.yml" -o /tmp/beta7-source.yml
          python - <<'PY'
          import base64
          from pathlib import Path
          text = Path('/tmp/beta7-source.yml').read_text()
          start = text.index('\nH4sI') + 1
          end = text.index('\nB64', start)
          payload = ''.join(text[start:end].split())
          Path('/tmp/beta7-overlay.tar.gz').write_bytes(base64.b64decode(payload))
          PY
          tar -xzf /tmp/beta7-overlay.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/beta7-upgrade.yml
          python -m compileall -q custom_components/welcomeeye_local
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/welcomeeye_local/manifest.json').read_text())
          assert manifest['version'] == '0.3.0-beta.7'
          PY

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Commit beta 7
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.3.0-beta.7"
          git push origin HEAD:main

      - name: Publish beta 7 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          if gh release view v0.3.0-beta.7 >/dev/null 2>&1; then
            echo "v0.3.0-beta.7 already exists"
          else
            gh release create v0.3.0-beta.7 \
              --target "$SHA" \
              --title "v0.3.0-beta.7" \
              --latest \
              --notes "Beta 7 adds legacy H.264 TLV 97/99 detection, stronger doorbell compatibility and diagnostics, vendor ring types 7/19/47, and automatic WelcomeEye Connect V1 vs Connect 2 model recognition. Diagnostics remain privacy-safe and media probing never sends output/open commands."
          fi
