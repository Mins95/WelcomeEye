name: Fix HACS release channel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-hacs-release.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Make beta 3 the latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v0.3.0-beta.3" \
            --repo "${{ github.repository }}" \
            --prerelease=false \
            --latest
