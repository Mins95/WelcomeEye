name: Prepare beta 2

on:
  push:
    paths:
      - .github/workflows/prepare-beta2.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare v0.3.0-beta.2
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          comp = root / 'custom_components' / 'welcomeeye_local'

          p = comp / 'client.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace('"""Bounded, local-only WelcomeEye TCP session. No automatic opening commands."""', '"""Bounded, local-only WelcomeEye TCP session."""')
          if 'self.device_time = 0' not in text:
              text = text.replace('        self.last_keepalive = 0\n', '        self.last_keepalive = 0\n        self.device_time = 0\n        self.clock_received = 0\n        self.encryption_profile = None\n', 1)
          text = text.replace("            status, _, _ = decode_login_reply(self.info.uid, replies[0])\n", "            status, _, metadata, device_time = decode_login_reply(\n                self.info.uid, replies[0], include_time=True)\n")
          if 'self.encryption_profile = metadata.get' not in text:
              text = text.replace("            if status != 1:\n                raise ProtocolError(f'Device login status {status}')\n            self.last_keepalive = time.monotonic()\n            return parts\n", "            if status != 1:\n                raise ProtocolError(f'Device login status {status}')\n            self.device_time = device_time\n            self.clock_received = time.monotonic()\n            self.encryption_profile = metadata.get('AppId')\n            self.last_keepalive = time.monotonic()\n            return parts\n")
          if '    def device_now(self):' not in text:
              text = text.replace('    def _exact(self, size):\n', "    def device_now(self):\n        if self.device_time <= 0:\n            raise ProtocolError('Device clock is unavailable')\n        return self.device_time + int(time.monotonic() - self.clock_received)\n\n    def _exact(self, size):\n")
          p.write_text(text, encoding='utf-8')

          p = comp / 'protected.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace('def decode_login_reply(uid, payload):', 'def decode_login_reply(uid, payload, *, include_time=False):', 1)
          text = text.replace('    status, reason = struct.unpack_from("<HH", clear, 8)\n    return status, reason, extra\n', '    status, reason = struct.unpack_from("<HH", clear, 8)\n    if include_time:\n        return status, reason, extra, struct.unpack_from(\'<Q\', clear)[0]\n    return status, reason, extra\n', 1)
          if 'def build_unlock_request(' not in text:
              text += '''\n\ndef build_unlock_request(uid, profile, device_time, encoded_password, output):
    """Build the native protected output command (TLV 505)."""
    if output not in (0, 1) or isinstance(output, bool):
        raise ValueError('Output must be 0 or 1')
    password = encoded_password.encode('ascii')
    if len(password) > 31 or b'\\0' in password or device_time <= 0:
        raise ValueError('Invalid unlock parameters')
    a, b, c = (profile_nonce(profile) for _ in range(3))
    clear = struct.pack('<QI32sIBB2x', device_time, 0, password, 0, output, 1)
    key = a[8:14] + b[4:9] + bytes(5)
    iv = c[4:15] + bytes(5)
    return owsp(tlv(505, rc4(uid.encode('ascii'), a + b + aes_cfb(key, iv, clear) + c)))


def decode_unlock_reply(uid, payload):
    """Decode the native protected output acknowledgement (TLV 506)."""
    if len(payload) != 48:
        raise ProtocolError('Invalid unlock reply size')
    inner = rc4(uid.encode('ascii'), payload)
    if struct.unpack_from('<I', inner)[0] != 1:
        raise ProtocolError('Unknown unlock encryption type')
    a, b = inner[4:20], inner[32:48]
    if a[-1] != 0 or b[-1] != 0:
        raise ProtocolError('Invalid unlock reply nonce')
    key = a[9:12] + b[2:12] + bytes(3)
    iv = a[4:13] + bytes(7)
    clear = aes_cfb(key, iv, inner[20:32], decrypt=True)
    return struct.unpack('<QHH', clear)
'''
          text = text.replace('Discovery decryption and authenticated login have been validated with a\nWelcomeEye Connect 2 test device. No network calls are performed in this module.', 'Discovery, authenticated login and output control have been validated with a\nWelcomeEye Connect 2 test device. No network calls are performed in this module.')
          p.write_text(text, encoding='utf-8')

          p = comp / 'hub.py'
          text = p.read_text(encoding='utf-8')
          if 'from .control import DeviceController' not in text:
              text = text.replace('from .client import AuthenticationError, Session\n', 'from .client import AuthenticationError, Session\nfrom .control import DeviceController\n', 1)
          if 'self.control = DeviceController(self)' not in text:
              text = text.replace('        self.hass, self.entry = hass, entry\n', '        self.hass, self.entry = hass, entry\n        self.control = DeviceController(self)\n', 1)
          if '        self.control.close()\n' not in text:
              text = text.replace('    async def stop(self):\n        self.stopped = True\n', '    async def stop(self):\n        self.stopped = True\n        self.control.close()\n', 1)
          p.write_text(text, encoding='utf-8')

          p = comp / 'manifest.json'
          manifest = json.loads(p.read_text(encoding='utf-8'))
          manifest['version'] = '0.3.0-beta.2'
          p.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = comp / 'diagnostics.py'
          text = p.read_text(encoding='utf-8').replace("'version': '0.2.0'", "'version': '0.3.0-beta.2'")
          p.write_text(text, encoding='utf-8')

          p = root / 'README.md'
          text = p.read_text(encoding='utf-8')
          if '**Ouvrir la gâche**' not in text:
              text = text.replace('- Passive JPEG snapshot from the most recently decoded active video stream.\n', '- Passive JPEG snapshot from the most recently decoded active video stream.\n- Local output controls: **Ouvrir la gâche** (output 1) and **Ouvrir le portail** (output 2).\n', 1)
          text = text.replace('- Door/gate unlock controls are **not exposed** by this release.\n', '')
          if '## Door strike and gate controls' not in text:
              text = text.replace('## Security and privacy\n', '''## Door strike and gate controls

The tested WelcomeEye Connect 2 accepts its output command only after the device media session has been initialized.

When you press **Ouvrir la gâche** or **Ouvrir le portail** while no Home Assistant video stream is active, the integration therefore:

1. opens a temporary local media session;
2. waits for the device to report that the video stream is ready;
3. sends the requested output command exactly once;
4. waits for the device acknowledgement;
5. immediately closes the temporary session and releases the intercom stream.

This keeps the intercom available to the WelcomeEye application and indoor monitor while still allowing the two output buttons to work without first opening the Home Assistant camera manually.

Output 1 has been validated as the **door strike (gâche)** and output 2 as the **gate (portail)** on the tested Connect 2.

## Security and privacy
''', 1)
          p.write_text(text, encoding='utf-8')

          p = root / 'CHANGELOG.md'
          text = p.read_text(encoding='utf-8')
          if '## 0.3.0-beta.2 - 2026-09-11' not in text:
              marker = 'All notable changes to this project will be documented in this file.\n\n'
              entry = '''## 0.3.0-beta.2 - 2026-09-11

Second public beta with local output controls.

- Added **Ouvrir la gâche** (output 1).
- Added **Ouvrir le portail** (output 2).
- Added protected output-command support and device acknowledgement handling.
- When no media session is active, the integration briefly initializes a temporary video session before sending the command, then releases it immediately.
- Output commands are sent exactly once and are never automatically retried.
- The existing on-demand media behavior remains unchanged while idle.
- Ring/button event detection and microphone/two-way audio are still under development.

'''
              text = text.replace(marker, marker + entry, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Syntax and diff checks
        run: |
          python -m py_compile custom_components/welcomeeye_local/*.py
          git diff --check
          if grep -R -n -E '192\.168\.|ServeurGKA|CACHEDEV|device-auth\.local' custom_components README.md CHANGELOG.md; then exit 1; fi

      - name: Commit beta 2
        run: |
          git config user.name "Mins95"
          git config user.email "100408431+Mins95@users.noreply.github.com"
          git add custom_components/welcomeeye_local README.md CHANGELOG.md
          git commit -m "Prepare v0.3.0-beta.2"
          git push

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag v0.3.0-beta.2
          git push origin v0.3.0-beta.2
          cat > /tmp/release-notes.md <<'EOF'
          Second public beta of Philips WelcomeEye for Home Assistant.

          ### New
          - Added **Ouvrir la gâche** (output 1).
          - Added **Ouvrir le portail** (output 2).
          - Added protected output command acknowledgements.

          ### How the buttons work
          The tested WelcomeEye Connect 2 only accepts an output command after its media session has been initialized. If the Home Assistant camera is not already active, the integration briefly starts a local video session, waits until the stream is ready, sends the requested command once, waits for confirmation, then immediately closes the temporary session. The video stream is therefore not kept open while idle and remains available to the WelcomeEye app and indoor monitor.

          Ring/button event detection and microphone/two-way audio are still under development.
          EOF
          gh release create v0.3.0-beta.2 --prerelease --title "v0.3.0-beta.2" --notes-file /tmp/release-notes.md
