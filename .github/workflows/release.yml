name: Release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      hardware_validated:
        description: Current candidate passed the documented Connect 2 hardware checklist
        required: false
        type: boolean
        default: false
      hardware_evidence:
        description: HTTPS link to the dated hardware report for this exact commit
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: welcomeeye-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      HARDWARE_VALIDATED: ${{ inputs.hardware_validated || false }}
      HARDWARE_EVIDENCE: ${{ inputs.hardware_evidence || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Require current main and successful software CI
        run: |
          export MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$CANDIDATE_SHA&per_page=100" > validation-runs.json
          python tools/build_release.py --release-check validation-runs.json

      - name: Select new immutable beta tag
        id: candidate
        run: |
          VERSION=$(python -c "from tools.build_release import read_version; from pathlib import Path; print(read_version(Path('.')))")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          EXISTING=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [[ -n "$EXISTING" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists and is left untouched. Select the next beta version."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and validate archive before creating any tag or release
        if: steps.candidate.outputs.publish == 'true'
        run: python tools/build_release.py

      - name: Build current release notes
        if: steps.candidate.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          version = os.environ['VERSION']
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'^## ' + re.escape(version) + r'(?:\s[^\n]*)?\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          if match is None:
              raise SystemExit('Missing exact-version changelog section')
          evidence = os.environ['HARDWARE_EVIDENCE'].strip()
          notes = f'## v{version}\n\n{match.group(1).strip()}\n\n'
          notes += '### Validation evidence\n\n'
          if os.environ['HARDWARE_VALIDATED'] == 'true':
              notes += f'- Connect 2 checklist attested by the maintainer for commit `{os.environ["CANDIDATE_SHA"]}`: {evidence}\n'
          else:
              notes += '- Hardware validation of this beta candidate is PENDING. Published for installation and physical testing; no new hardware result is claimed.\n'
          notes += '- Required Validate workflow passed for this exact commit. Automated tests issue no physical output command.\n'
          notes += '- V1 local doorbell remains unsupported: no reliable local ring event was identified; a cloud path is possible but unproven.\n'
          notes += '- Strike and gate commands are single-shot, with no automatic retry or replay.\n'
          Path('release-notes.md').write_text(notes, encoding='utf-8')
          PY

      - name: Create immutable tag and draft prerelease with verified assets
        if: steps.candidate.outputs.publish == 'true'
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$MAIN_SHA" = "$CANDIDATE_SHA"
          git tag "$TAG" "$CANDIDATE_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --draft --prerelease \
            --title "$TAG" --notes-file release-notes.md \
            dist/welcomeeye_local.zip dist/welcomeeye_local.zip.sha256

      - name: Verify uploaded digest and publish prerelease
        if: steps.candidate.outputs.publish == 'true'
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          gh release download "$TAG" --dir downloaded \
            --pattern welcomeeye_local.zip --pattern welcomeeye_local.zip.sha256
          cd downloaded
          sha256sum --check welcomeeye_local.zip.sha256
          cmp welcomeeye_local.zip ../dist/welcomeeye_local.zip
          cd ..
          gh release edit "$TAG" --draft=false --prerelease
