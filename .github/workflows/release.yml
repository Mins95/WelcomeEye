name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/welcomeeye_local/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY2'
          import json
          from pathlib import Path
          data = json.loads(Path('custom_components/welcomeeye_local/manifest.json').read_text())
          print(data['version'])
          PY2
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --latest \
            --notes "Beta 12 adds the native WelcomeEye Connect V1/LT Stop AV exchange (protected TLV 5009/5010), so a failed or closed preview releases the V1 instead of leaving it busy and blocking doorbell/output control. Successful device discovery is now serialized and cached for the Home Assistant process, so media, doorbell and control sessions reuse the validated TCP endpoint instead of repeatedly probing the V1 over UDP. Beta 11 transport fixes, beta 10 Start AV 5007/5008 and Connect 2/WebRTC behavior are retained."
