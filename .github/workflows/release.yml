name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/welcomeeye_local/manifest.json
      - hacs.json
      - README.md
      - images/**
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY2'
          import json
          from pathlib import Path
          data = json.loads(Path('custom_components/welcomeeye_local/manifest.json').read_text())
          print(data['version'])
          PY2
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether a release is needed
        id: release_state
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists on commit $TAG_SHA."
              echo "Current commit is $GITHUB_SHA; this is a documentation/workflow update with no version bump."
              echo "Nothing to publish. Bump manifest.json when a new release is intended."
              exit 0
            fi
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: No release needed
        if: steps.release_state.outputs.publish == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          echo "$TAG is already published from an earlier commit. Release workflow completed successfully without changing the existing tag or release."

      - name: Build release notes from changelog
        if: steps.release_state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          python - <<'PY2'
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          tag = os.environ['TAG']
          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          start = None
          end = len(lines)
          marker = f'## {version}'

          for index, line in enumerate(lines):
              if line.startswith(marker):
                  start = index + 1
                  break

          if start is None:
              raise SystemExit(f'No CHANGELOG section found for {version}')

          for index in range(start, len(lines)):
              if lines[index].startswith('## '):
                  end = index
                  break

          body = '\n'.join(lines[start:end]).strip()
          notes = (
              f'## {tag}\n\n{body}\n\n'
              '### Validation status\n\n'
              '- WelcomeEye Connect 2 live video, two-way audio, door strike, gate and local doorbell are hardware-validated.\n'
              '- WelcomeEye Connect V1 / DES9900VDP live video, audio in/out (microphone / talkback) and physical door strike are hardware-validated from 0.4.1.\n'
              '- V1 gate operation remains pending physical validation.\n'
              '- V1 local doorbell is in development in 0.4.2-beta.2: the existing Connect 2 listener path is enabled for field testing and is not yet hardware-validated on V1.\n'
              '- The Sonnette binary sensor keeps each distinct decoded ring visible for 5 seconds on both models; immediate ring events remain unchanged.\n'
              '- Dashboard module registration and version updates are automatic in storage mode; restart HA and fully reload the frontend. YAML-managed resources remain manual.\n'
              '- Physical output commands remain single-shot and are never automatically retried.\n'
          )
          Path('release-notes.md').write_text(notes, encoding='utf-8')
          PY2

      - name: Create or normalize GitHub release
        if: steps.release_state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG is a prerelease; normalizing prerelease metadata."
              gh release edit "$TAG" \
                --prerelease \
                --notes-file release-notes.md
            else
              gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --title "$TAG" \
                --prerelease \
                --notes-file release-notes.md
            fi
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG is a stable release; normalizing stable metadata."
              gh release edit "$TAG" \
                --prerelease=false \
                --latest \
                --notes-file release-notes.md
            else
              gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --title "$TAG" \
                --latest \
                --notes-file release-notes.md
            fi
          fi

      - name: Build HACS release ZIP
        if: steps.release_state.outputs.publish == 'true'
        shell: bash
        run: |
          ASSET="$GITHUB_WORKSPACE/welcomeeye_local.zip"
          cd "$GITHUB_WORKSPACE/custom_components/welcomeeye_local"
          zip -qr "$ASSET" .
          cd "$GITHUB_WORKSPACE"
          python - <<'PY2'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path('welcomeeye_local.zip')
          with ZipFile(archive) as zf:
              names = set(zf.namelist())
              if 'manifest.json' not in names:
                  raise SystemExit('HACS ZIP must contain manifest.json at archive root')
          print(f'Built {archive} ({archive.stat().st_size} bytes)')
          PY2

      - name: Upload HACS ZIP asset
        if: steps.release_state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          ASSET="welcomeeye_local.zip"
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
            echo "$ASSET already exists on $TAG; keeping it so its GitHub download counter is preserved."
          else
            gh release upload "$TAG" "$ASSET"
          fi
