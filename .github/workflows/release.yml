name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/welcomeeye_local/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY2'
          import json
          from pathlib import Path
          data = json.loads(Path('custom_components/welcomeeye_local/manifest.json').read_text())
          print(data['version'])
          PY2
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or normalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          NOTES="${TAG} keeps the hardware-validated WelcomeEye Connect V1 video path, keeps the V1 doorbell listener on standby, and restores the pre-doorbell direct V1 output-control path without listener pause/resume or the one-second settle handover. Video diagnostics are reduced to a compact summary now that V1 video is validated. Connect 2 behavior remains unchanged. Physical door/gate commands remain single-shot and are never automatically retried. Previous beta releases, including v0.3.1-beta.2 and v0.3.1-beta.3, are retained for rollback and comparison."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; normalizing release metadata."
            gh release edit "$TAG" --prerelease=false --latest --notes "$NOTES"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --latest \
              --notes "$NOTES"
          fi

      - name: Remove merged beta development branches
        shell: bash
        run: |
          git ls-remote --heads origin 'refs/heads/beta*' | awk '{sub("refs/heads/", "", $2); print $2}' | while read -r OLD_BRANCH; do
            if [ -n "$OLD_BRANCH" ]; then
              echo "Removing merged beta branch $OLD_BRANCH"
              git push origin ":refs/heads/$OLD_BRANCH" || true
            fi
          done
