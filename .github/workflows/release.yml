name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/welcomeeye_local/manifest.json
      - hacs.json
      - README.md
      - images/**
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY2'
          import json
          from pathlib import Path
          data = json.loads(Path('custom_components/welcomeeye_local/manifest.json').read_text())
          print(data['version'])
          PY2
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          python - <<'PY2'
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          tag = os.environ['TAG']
          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          start = None
          end = len(lines)
          changelog_version = '0.3.1-beta.9' if version in ('0.3.1-rc.1', '0.3.1-rc.2') else version
          marker = f'## {changelog_version}'

          for index, line in enumerate(lines):
              if line.startswith(marker):
                  start = index + 1
                  break

          if start is None:
              raise SystemExit(f'No CHANGELOG section found for {version}')

          for index in range(start, len(lines)):
              if lines[index].startswith('## '):
                  end = index
                  break

          body = '\n'.join(lines[start:end]).strip()
          if version == '0.3.1-rc.1':
              body = body.replace('Beta 9', 'RC1').replace('beta 9', 'RC1')
          elif version == '0.3.1-rc.2':
              body = body.replace('Beta 9', 'RC2').replace('beta 9', 'RC2')
              body += (
                  '\n- Publish a dedicated `welcomeeye_local.zip` release asset so GitHub/HACS download counters track actual integration downloads.\n'
                  '- Keep the GitHub stars badge linked to the repository stargazer count; stars are read from GitHub repository metadata.\n'
                  '- RC2 replaces RC1; the RC1 release and tag are removed only after the RC2 asset has been uploaded successfully.'
              )
          notes = (
              f'## {tag}\n\n{body}\n\n'
              '### Validation status\n\n'
              '- WelcomeEye Connect V1 video remains hardware validated.\n'
              '- V1 strike/gate live-channel routing is software validated; physical relay actuation remains to be confirmed on real hardware.\n'
              '- V1 doorbell remains on standby while a reliable local event path is investigated.\n'
              '- Connect 2 behavior is unchanged.\n'
              '- Physical output commands remain single-shot and are never automatically retried.\n'
          )
          Path('release-notes.md').write_text(notes, encoding='utf-8')
          PY2

      - name: Replace beta 9 release when publishing RC1
        if: steps.version.outputs.version == '0.3.1-rc.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.3.1-beta.9 >/dev/null 2>&1; then
            gh release delete v0.3.1-beta.9 --yes --cleanup-tag
          fi

      - name: Align existing release tag with current release metadata
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Updating $TAG to $GITHUB_SHA so HACS reads the current repository presentation and metadata."
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
          fi

      - name: Create or normalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG is a prerelease; normalizing prerelease metadata."
              gh release edit "$TAG" \
                --prerelease \
                --notes-file release-notes.md
            else
              gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --title "$TAG" \
                --prerelease \
                --notes-file release-notes.md
            fi
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG is a stable release; normalizing stable metadata."
              gh release edit "$TAG" \
                --prerelease=false \
                --latest \
                --notes-file release-notes.md
            else
              gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --title "$TAG" \
                --latest \
                --notes-file release-notes.md
            fi
          fi

      - name: Build HACS release ZIP
        shell: bash
        run: |
          ASSET="$GITHUB_WORKSPACE/welcomeeye_local.zip"
          cd "$GITHUB_WORKSPACE/custom_components/welcomeeye_local"
          zip -qr "$ASSET" .
          cd "$GITHUB_WORKSPACE"
          python - <<'PY2'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path('welcomeeye_local.zip')
          with ZipFile(archive) as zf:
              names = set(zf.namelist())
              if 'manifest.json' not in names:
                  raise SystemExit('HACS ZIP must contain manifest.json at archive root')
          print(f'Built {archive} ({archive.stat().st_size} bytes)')
          PY2

      - name: Upload HACS ZIP asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          ASSET="welcomeeye_local.zip"
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
            echo "$ASSET already exists on $TAG; keeping it so its GitHub download counter is preserved."
          else
            gh release upload "$TAG" "$ASSET"
          fi

      - name: Replace RC1 after RC2 asset is ready
        if: steps.version.outputs.version == '0.3.1-rc.2'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.3.1-rc.1 >/dev/null 2>&1; then
            gh release delete v0.3.1-rc.1 --yes --cleanup-tag
          fi

      - name: Remove fully merged development branches
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | while read -r REMOTE_BRANCH; do
            BRANCH="${REMOTE_BRANCH#origin/}"
            if [ -z "$BRANCH" ] || [ "$BRANCH" = "main" ] || [ "$BRANCH" = "HEAD" ]; then
              continue
            fi
            if git merge-base --is-ancestor "$REMOTE_BRANCH" origin/main; then
              echo "Removing fully merged branch $BRANCH"
              git push origin ":refs/heads/$BRANCH"
            else
              echo "Keeping unmerged branch $BRANCH"
            fi
          done
