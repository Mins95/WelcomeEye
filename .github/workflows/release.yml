name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/welcomeeye_local/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('custom_components/welcomeeye_local/manifest.json').read_text())
          print(data['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --latest \
            --notes "Beta 5 strengthens downloadable diagnostics for WelcomeEye compatibility testing. It adds WebRTC stage/error tracking and media TLV counters (203/98/100/101) without storing SDP, ICE values, credentials, identifiers or media payloads. Functional behavior is unchanged from beta 4."
