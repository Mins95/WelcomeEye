name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/welcomeeye_local/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY2'
          import json
          from pathlib import Path
          data = json.loads(Path('custom_components/welcomeeye_local/manifest.json').read_text())
          print(data['version'])
          PY2
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --latest \
            --notes "v0.3.1-beta.1 introduces a native-backed WelcomeEye Connect V1 video transport fix. V1 media sessions now retain partial OWSP payload bytes across intermediate socket timeouts, with strict 6-second no-progress, 20-second total and 1-MiB bounds, and never parse incomplete packets. V1 video metadata is separated from complete TLV 100/101 I/P images and Annex-B image bytes are passed unchanged to the existing media pipeline. Ring/control coordination hardening, UID checks, cooldown and no-retry output safety are retained; Connect 2 media/WebRTC behavior remains unchanged. The candidate passed 71 offline tests including real PyAV decode to JPEG. V1 fragment TLVs remain intentionally unsupported pending hardware evidence."
