name: Publish beta 3 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-beta3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.3.0-beta.3" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v0.3.0-beta.3" \
            --prerelease \
            --notes $'Branding update for Philips WelcomeEye.\n\n- Added the official Philips WelcomeEye app icon to the integration.\n- Added local Home Assistant brand icon/logo assets for light and dark themes.\n- Added the WelcomeEye logo to the GitHub README.\n\nFunctional behavior is unchanged from v0.3.0-beta.2: local video/audio plus the door-strike and gate output buttons with temporary media-session warmup.'
