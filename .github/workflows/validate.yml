name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} tests and package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test dependencies
        run: python -m pip install pillow tzdata cryptography aiohttp 'av>=14,<18'
      - name: Compile integration
        run: python -m compileall -q custom_components/welcomeeye_local
      - name: Test all offline regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and verify reproducible HACS package
        run: python tools/build_release.py
      - name: Check whitespace
        run: git diff --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check card syntax
        run: node --check custom_components/welcomeeye_local/frontend/welcomeeye-card.js
      - name: Test card controls and lifecycle
        run: node --test tests/frontend/*.test.cjs

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  capture-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test actual HA ImageEntity, switch, service and Media APIs
        run: |
          docker run --rm --entrypoint python -v "$PWD:/audit:ro" \
            ghcr.io/home-assistant/home-assistant:2026.9.3 /audit/tools/verify_image_runtime.py
          docker run --rm --entrypoint python -v "$PWD:/audit:ro" \
            ghcr.io/home-assistant/home-assistant:2026.9.3 /audit/tools/verify_capture_runtime.py

  r002-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: ['2026.7.3', '2026.9.3']
    steps:
      - uses: actions/checkout@v4
      - name: Test real HA services, permissions, privacy and certificate recheck (mocked network)
        run: |
          docker run --rm --entrypoint python -v "$PWD:/audit:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} /audit/tools/verify_r002_runtime.py
          docker run --rm --entrypoint python -v "$PWD:/audit:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} /audit/tools/verify_r002_certificate_versions.py
          docker run --rm --entrypoint python -v "$PWD:/audit:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} /audit/tools/verify_connect3_runtime.py
          docker run --rm --entrypoint python -v "$PWD:/audit:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} /audit/tools/verify_connect3_media_runtime.py
          docker run --rm --entrypoint python -v "$PWD:/audit:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} /audit/tools/verify_r002_qv_runtime.py
          docker run --rm --entrypoint python -v "$PWD:/audit:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} /audit/tools/verify_experimental_runtime.py
          docker run --rm --entrypoint python -v "$PWD:/audit:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} /audit/tools/verify_v1_doorbell_runtime.py
          docker run --rm --entrypoint python -v "$PWD:/audit:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} /audit/tools/verify_media_source_runtime.py

  certificate-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cryptography: ['42.0.8', '46.0.7', '50.0.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare loader warnings or rejection with independent DER metadata reader
        run: |
          python -m pip install cryptography==${{ matrix.cryptography }}
          python tools/verify_r002_certificate_versions.py

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
