name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-compile:
    name: Python ${{ matrix.python-version }} compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile integration
        run: python -m compileall -q custom_components/welcomeeye_local

      - name: Validate manifest JSON
        run: python -m json.tool custom_components/welcomeeye_local/manifest.json >/dev/null

      - name: Test dashboard resource migration
        run: python -m unittest discover -s tests -p 'test_card_resource.py' -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
