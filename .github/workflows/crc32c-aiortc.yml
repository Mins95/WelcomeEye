name: Native CRC32C aiortc validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        ha: ['2026.9.3', '2026.10.0']
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build derivative from hash-pinned official wheel
        run: python tools/crc32c/build_aiortc.py --output out
      - name: Install with HA package manager and test real musl runtime
        run: |
          set -o pipefail
          docker run --rm --entrypoint /bin/sh -v "$PWD:/audit:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} -ec '
              if [ "${{ matrix.ha }}" = "2026.10.0" ]; then
                python /audit/tools/crc32c/verify_ha202610_requirements.py
              fi
              python /audit/tools/crc32c/verify_ha_install.py
              python /audit/tools/crc32c/verify_aiortc.py
              python /audit/tools/crc32c/verify_sctp_upstream.py --codecs
            ' | tee out/musl-validation.txt
      - name: Test glibc Python runtime
        if: matrix.ha == '2026.10.0'
        run: |
          set -o pipefail
          docker run --rm --entrypoint /bin/sh -v "$PWD:/audit:ro" python:3.14-slim -ec '
              pip install --only-binary=:all: /audit/out/*.whl "av==19.0.0"
              python /audit/tools/crc32c/verify_aiortc.py
              python /audit/tools/crc32c/verify_sctp_upstream.py --codecs
            ' | tee out/glibc-validation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiortc-native-crc32c-${{ matrix.arch }}-ha-${{ matrix.ha }}
          path: out/
